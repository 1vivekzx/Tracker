          cat > /tmp/patch_manifest.py <<'EOF_PM'
          # AndroidManifest mein permissions, widgets, service aur notification icon jodta hai (dobara chalane par bhi safe).
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()

          for perm in ("android.permission.POST_NOTIFICATIONS", "android.permission.SCHEDULE_EXACT_ALARM", "android.permission.USE_EXACT_ALARM"):
              if perm not in s:
                  s = s.replace("<application", '<uses-permission android:name="%s" />\n    <application' % perm, 1)

          if "MainCountdownWidget" not in s:
              block = """
                  <meta-data android:name="com.capacitorjs.plugins.localnotifications.notification_icon" android:resource="@drawable/ic_stat_exam" />
                  <meta-data android:name="com.capacitorjs.plugins.localnotifications.notification_icon_color" android:resource="@color/exam_amber" />
                  <receiver android:name=".MainCountdownWidget" android:label="1. Exam Countdown" android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="com.cbse.examtracker.WIDGET_TICK" />
                      </intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_main_info" />
                  </receiver>
                  <receiver android:name=".DualCoreWidget" android:label="2. Pinned Papers" android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_dual_info" />
                  </receiver>
                  <receiver android:name=".ScheduleWidget" android:label="3. Full Date Sheet" android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_schedule_info" />
                  </receiver>
                  <activity android:name=".ExamWidgetConfigActivity" android:exported="true" android:theme="@android:style/Theme.DeviceDefault.Dialog">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_CONFIGURE" />
                      </intent-filter>
                  </activity>
                  <service android:name=".ScheduleWidgetService" android:permission="android.permission.BIND_REMOTEVIEWS" android:exported="false" />
              """
              s = s.replace("</application>", block + "\n    </application>", 1)

          open(p, "w", encoding="utf-8").write(s)

          # notification colour resource
          import os
          os.makedirs("android/app/src/main/res/values", exist_ok=True)
          open("android/app/src/main/res/values/exam_colors.xml", "w", encoding="utf-8").write(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="exam_amber">#F59E0B</color>\n</resources>\n')
          print("manifest patched")
          EOF_PM
