name: Build Exam Tracker APK

# Sirf ZIP (examtracker-update.zip) aur ye ek file GitHub par rakhni hai.
# Ye workflow: ZIP kholkar website ki files repo mein daalta hai, phir Android app (APK) banata hai
# aur GitHub ke Releases mein "Exam Tracker APK (latest)" naam se download link de deta hai.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: ZIP kholo aur website ki files repo mein daalo
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "Repo mein koi ZIP nahi hai; maujooda files se APK banegi."
            exit 0
          fi
          rm -rf /tmp/z && mkdir /tmp/z
          for z in "${zips[@]}"; do echo "Khol raha hoon: $z"; unzip -oq "$z" -d /tmp/z; done
          idx=$(find /tmp/z -maxdepth 3 -name index.html -not -path "*/android/*" | head -1)
          if [ -z "$idx" ]; then echo "ZIP ke andar index.html nahi mila"; exit 1; fi
          src=$(dirname "$idx")
          rm -rf "$src/.github" "$src/android" "$src/native" "$src/node_modules" "$src/www" "$src/__MACOSX" /tmp/z/__MACOSX
          cp -a "$src"/. ./
          rm -f "${zips[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Koi badlaav nahi."
          else
            git commit -q -m "Tapasya ZIP se files update (auto)"
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "Push nahi ho paya (Settings > Actions > Workflow permissions: Read and write chunein)."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Web Files
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon.svg www/

      - name: Initialize Capacitor Android Project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/local-notifications @capacitor/preferences
          npx cap init "Exam Tracker" "com.cbse.examtracker" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Update Custom App Logo from icon.svg
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p android/app/src/main/res/$dir
            rsvg-convert -w 192 -h 192 icon.svg -o android/app/src/main/res/$dir/ic_launcher.png
            rsvg-convert -w 192 -h 192 icon.svg -o android/app/src/main/res/$dir/ic_launcher_round.png
            rsvg-convert -w 192 -h 192 icon.svg -o android/app/src/main/res/$dir/ic_launcher_foreground.png
          done

      - name: Inject Exam Tracker native code (3 widgets, timer notification)
        run: |
          set -e
          rm -f android/app/src/main/java/com/cbse/examtracker/MainActivity.*
          mkdir -p "$(dirname android/app/src/main/java/com/cbse/examtracker/DualCoreWidget.java)"
          cat > android/app/src/main/java/com/cbse/examtracker/DualCoreWidget.java <<'EOF_0'
          package com.cbse.examtracker;

          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.Context;
          import android.os.Bundle;

          public class DualCoreWidget extends AppWidgetProvider {
              @Override
              public void onUpdate(Context context, AppWidgetManager manager, int[] ids) {
                  ExamWidgetUtil.updateAll(context);
              }

              @Override
              public void onAppWidgetOptionsChanged(Context context, AppWidgetManager manager, int id, Bundle options) {
                  ExamWidgetUtil.updateAll(context);
              }

              @Override
              public void onDeleted(Context context, int[] ids) {
                  ExamWidgetUtil.clearConfig(context, ids);
              }

              @Override
              public void onEnabled(Context context) {
                  ExamWidgetUtil.updateAll(context);
              }
          }
          EOF_0
          mkdir -p "$(dirname android/app/src/main/java/com/cbse/examtracker/ExamNativePlugin.java)"
          cat > android/app/src/main/java/com/cbse/examtracker/ExamNativePlugin.java <<'EOF_1'
          package com.cbse.examtracker;

          import android.app.Notification;
          import android.appwidget.AppWidgetManager;
          import android.content.ComponentName;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.os.Build;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          /** Web app se Android ke kaam: widgets turant refresh, aur notification mein chalta hua study timer. */
          @CapacitorPlugin(name = "ExamNative")
          public class ExamNativePlugin extends Plugin {
              private static final String CHANNEL = "exam_timer";
              private static final int TIMER_ID = 9100;

              /** Phone/launcher "widget seedha home screen par lagao" ka popup support karta hai ya nahi. */
              @PluginMethod
              public void canPinWidgets(PluginCall call) {
                  boolean ok = false;
                  try {
                      ok = Build.VERSION.SDK_INT >= 26 && AppWidgetManager.getInstance(getContext()).isRequestPinAppWidgetSupported();
                  } catch (Exception ignored) {
                  }
                  JSObject r = new JSObject();
                  r.put("supported", ok);
                  call.resolve(r);
              }

              /** type: main | dual | schedule. System ka "Add widget" popup kholta hai. */
              @PluginMethod
              public void pinWidget(PluginCall call) {
                  boolean requested = false;
                  try {
                      String t = call.getString("type", "main");
                      Class<?> cls = "dual".equals(t) ? DualCoreWidget.class : "schedule".equals(t) ? ScheduleWidget.class : MainCountdownWidget.class;
                      AppWidgetManager m = AppWidgetManager.getInstance(getContext());
                      if (Build.VERSION.SDK_INT >= 26 && m.isRequestPinAppWidgetSupported()) {
                          requested = m.requestPinAppWidget(new ComponentName(getContext(), cls), null, null);
                      }
                  } catch (Exception ignored) {
                  }
                  JSObject r = new JSObject();
                  r.put("requested", requested);
                  call.resolve(r);
              }

              @PluginMethod
              public void refreshWidgets(PluginCall call) {
                  ExamWidgetUtil.updateAll(getContext());
                  call.resolve();
              }

              @PluginMethod
              public void timerStart(PluginCall call) {
                  try {
                      Context c = getContext();
                      Long base = call.getLong("base");
                      Boolean cd = call.getBoolean("countdown", false);
                      boolean down = cd != null && cd;
                      String title = call.getString("title", "Study Timer");
                      NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                      Notification.Builder b;
                      if (Build.VERSION.SDK_INT >= 26) {
                          nm.createNotificationChannel(new NotificationChannel(CHANNEL, "Study timer", NotificationManager.IMPORTANCE_LOW));
                          b = new Notification.Builder(c, CHANNEL);
                      } else {
                          b = new Notification.Builder(c);
                      }
                      b.setSmallIcon(R.drawable.ic_stat_exam)
                              .setContentTitle(title)
                              .setContentText(down ? "Countdown running" : "Stopwatch running")
                              .setOngoing(true)
                              .setOnlyAlertOnce(true)
                              .setShowWhen(true)
                              .setUsesChronometer(true)
                              .setColor(0xFFF59E0B)
                              .setContentIntent(ExamWidgetUtil.open(c, 104));
                      if (base != null) b.setWhen(base);
                      if (Build.VERSION.SDK_INT >= 24) b.setChronometerCountDown(down);
                      nm.notify(TIMER_ID, b.build());
                  } catch (Exception ignored) {
                  }
                  call.resolve();
              }

              @PluginMethod
              public void timerStop(PluginCall call) {
                  try {
                      NotificationManager nm = (NotificationManager) getContext().getSystemService(Context.NOTIFICATION_SERVICE);
                      nm.cancel(TIMER_ID);
                  } catch (Exception ignored) {
                  }
                  call.resolve();
              }
          }
          EOF_1
          mkdir -p "$(dirname android/app/src/main/java/com/cbse/examtracker/ExamWidgetConfigActivity.java)"
          cat > android/app/src/main/java/com/cbse/examtracker/ExamWidgetConfigActivity.java <<'EOF_2'
          package com.cbse.examtracker;

          import android.app.Activity;
          import android.appwidget.AppWidgetManager;
          import android.content.Intent;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.Spinner;
          import android.widget.TextView;
          import java.util.ArrayList;
          import java.util.LinkedHashSet;
          import org.json.JSONArray;
          import org.json.JSONObject;

          /** Widget lagate (ya baad mein dobara configure karte) samay subject / paper pin karne ki screen. */
          public class ExamWidgetConfigActivity extends Activity {
              private int widgetId = AppWidgetManager.INVALID_APPWIDGET_ID;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setResult(RESULT_CANCELED);
                  Intent in = getIntent();
                  if (in != null && in.getExtras() != null) {
                      widgetId = in.getExtras().getInt(AppWidgetManager.EXTRA_APPWIDGET_ID, AppWidgetManager.INVALID_APPWIDGET_ID);
                  }
                  if (widgetId == AppWidgetManager.INVALID_APPWIDGET_ID) {
                      finish();
                      return;
                  }
                  String cls = "";
                  try {
                      cls = AppWidgetManager.getInstance(this).getAppWidgetInfo(widgetId).provider.getClassName();
                  } catch (Exception ignored) {
                  }
                  final boolean dual = cls.endsWith("DualCoreWidget");

                  JSONObject bundle = ExamWidgetUtil.bundle(this);
                  JSONArray rows = bundle.optJSONArray("datesheet");
                  final LinkedHashSet<String> subjects = new LinkedHashSet<String>();
                  if (rows != null) {
                      for (int i = 0; i < rows.length(); i++) {
                          JSONObject o = rows.optJSONObject(i);
                          if (o != null) subjects.add(o.optString("subject", ""));
                      }
                  }
                  final ArrayList<String> items = new ArrayList<String>();
                  if (!dual) items.add("Auto: next upcoming paper");
                  items.addAll(subjects);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  int pad = (int) (18 * getResources().getDisplayMetrics().density);
                  root.setPadding(pad, pad, pad, pad);

                  TextView title = new TextView(this);
                  title.setText(dual ? "Pin 2 papers for this widget" : "Pin a paper for this widget");
                  title.setTextSize(18);
                  title.setPadding(0, 0, 0, pad / 2);
                  root.addView(title);

                  if (subjects.isEmpty()) {
                      TextView t = new TextView(this);
                      t.setText("Open the Exam Tracker app once so your date sheet loads, then add the widget again.");
                      root.addView(t);
                  }

                  final Spinner s1 = new Spinner(this);
                  s1.setAdapter(new ArrayAdapter<String>(this, android.R.layout.simple_spinner_dropdown_item, items));
                  root.addView(s1);
                  final Spinner s2 = new Spinner(this);
                  s2.setAdapter(new ArrayAdapter<String>(this, android.R.layout.simple_spinner_dropdown_item, items));
                  if (dual) {
                      if (items.size() > 1) s2.setSelection(1);
                      root.addView(s2);
                  }

                  JSONArray cur = ExamWidgetUtil.config(this, widgetId);
                  if (cur.length() > 0) {
                      int i1 = items.indexOf(cur.optString(0));
                      if (i1 >= 0) s1.setSelection(i1);
                  }
                  if (dual && cur.length() > 1) {
                      int i2 = items.indexOf(cur.optString(1));
                      if (i2 >= 0) s2.setSelection(i2);
                  }

                  Button save = new Button(this);
                  save.setText("Save widget");
                  save.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          JSONArray out = new JSONArray();
                          String a = (String) s1.getSelectedItem();
                          if (a != null && subjects.contains(a)) out.put(a);
                          if (dual) {
                              String c2 = (String) s2.getSelectedItem();
                              if (out.length() == 0 && c2 != null) out.put("");
                              if (c2 != null && subjects.contains(c2)) out.put(c2);
                          }
                          ExamWidgetUtil.saveConfig(ExamWidgetConfigActivity.this, widgetId, out);
                          ExamWidgetUtil.updateAll(ExamWidgetConfigActivity.this);
                          Intent res = new Intent();
                          res.putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, widgetId);
                          setResult(RESULT_OK, res);
                          finish();
                      }
                  });
                  root.addView(save);
                  setContentView(root);
              }
          }
          EOF_2
          mkdir -p "$(dirname android/app/src/main/java/com/cbse/examtracker/ExamWidgetUtil.java)"
          cat > android/app/src/main/java/com/cbse/examtracker/ExamWidgetUtil.java <<'EOF_3'
          package com.cbse.examtracker;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.content.SharedPreferences;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.view.View;
          import android.widget.RemoteViews;
          import org.json.JSONArray;
          import org.json.JSONObject;

          /** Teeno widgets ka sara data (app ki date sheet se) aur live countdown ka kaam. */
          final class ExamWidgetUtil {
              static final String ACTION_TICK = "com.cbse.examtracker.WIDGET_TICK";
              static final long DAY = 86400000L;
              private static final int FLAGS = PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE;

              static JSONObject bundle(Context c) {
                  try {
                      String raw = c.getSharedPreferences("CapacitorStorage", Context.MODE_PRIVATE).getString("exam_widgets_bundle", null);
                      if (raw != null) return new JSONObject(raw);
                  } catch (Exception ignored) {
                  }
                  return new JSONObject();
              }

              /** Widget-wise chuna hua paper (subject ka naam). Khali = app ki setting / agla paper. */
              static JSONArray config(Context c, int id) {
                  try {
                      return new JSONArray(c.getSharedPreferences("exam_widget_cfg", Context.MODE_PRIVATE).getString("w" + id, "[]"));
                  } catch (Exception e) {
                      return new JSONArray();
                  }
              }

              static void saveConfig(Context c, int id, JSONArray a) {
                  c.getSharedPreferences("exam_widget_cfg", Context.MODE_PRIVATE).edit().putString("w" + id, a.toString()).apply();
              }

              static void clearConfig(Context c, int[] ids) {
                  SharedPreferences.Editor e = c.getSharedPreferences("exam_widget_cfg", Context.MODE_PRIVATE).edit();
                  for (int id : ids) e.remove("w" + id);
                  e.apply();
              }

              /** datesheet mein se subject naam wala paper (agla aane wala pehle, warna koi bhi). */
              static JSONObject findPaper(JSONObject b, String subject) {
                  JSONArray rows = b.optJSONArray("datesheet");
                  if (rows == null || subject == null || subject.isEmpty()) return null;
                  long now = System.currentTimeMillis();
                  JSONObject any = null;
                  for (int i = 0; i < rows.length(); i++) {
                      JSONObject o = rows.optJSONObject(i);
                      if (o == null || !subject.equals(o.optString("subject"))) continue;
                      if (any == null) any = o;
                      if (o.optLong("at", 0) > now) return o;
                  }
                  return any;
              }

              static boolean isSmall(Context c, int id) {
                  try {
                      Bundle o = AppWidgetManager.getInstance(c).getAppWidgetOptions(id);
                      int w = o.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_WIDTH, 250);
                      int h = o.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_HEIGHT, 110);
                      return h < 100 || w < 200;
                  } catch (Exception e) {
                      return false;
                  }
              }

              static PendingIntent open(Context c, int req) {
                  Intent i = c.getPackageManager().getLaunchIntentForPackage(c.getPackageName());
                  if (i == null) i = new Intent();
                  i.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);
                  return PendingIntent.getActivity(c, req, i, FLAGS);
              }

              static String minText(int m) {
                  return m >= 60 ? (m / 60) + "h " + (m % 60) + "m" : m + "m";
              }

              /** days alag text mein, baaki ghante:minute:second live chronometer mein (har second chalta hai). */
              static void bindCountdown(RemoteViews v, int daysId, int chronoId, long at) {
                  long diff = at - System.currentTimeMillis();
                  if (at <= 0 || diff <= 0) {
                      v.setTextViewText(daysId, "0");
                      v.setViewVisibility(chronoId, View.GONE);
                      return;
                  }
                  long days = diff / DAY;
                  long rem = diff % DAY;
                  v.setTextViewText(daysId, String.valueOf(days));
                  if (Build.VERSION.SDK_INT >= 24) {
                      v.setViewVisibility(chronoId, View.VISIBLE);
                      v.setChronometerCountDown(chronoId, true);
                      v.setChronometer(chronoId, SystemClock.elapsedRealtime() + rem, null, true);
                  } else {
                      v.setViewVisibility(chronoId, View.GONE);
                      v.setTextViewText(daysId, days + "d " + (rem / 3600000L) + "h " + ((rem / 60000L) % 60L) + "m");
                  }
              }

              static RemoteViews buildMain(Context c, int id) {
                  JSONObject b = bundle(c);
                  boolean small = isSmall(c, id);
                  RemoteViews v = new RemoteViews(c.getPackageName(), small ? R.layout.widget_main_small : R.layout.widget_main);
                  String subject = b.optString("nextSubject", "Open the app once");
                  String date = b.optString("nextDate", "");
                  long at = b.optLong("nextAt", 0);
                  JSONArray cfg = config(c, id);
                  if (cfg.length() > 0) {
                      JSONObject p = findPaper(b, cfg.optString(0));
                      if (p != null) {
                          subject = p.optString("subject", subject);
                          date = p.optString("date", "") + " · " + p.optString("time", "");
                          at = p.optLong("at", 0);
                      }
                  }
                  v.setTextViewText(R.id.w1_subject, subject);
                  bindCountdown(v, R.id.w1_days, R.id.w1_chrono, at);
                  if (!small) {
                      v.setTextViewText(R.id.w1_date, date);
                      String mission = b.optString("upcomingCount", "");
                      if (b.has("todayMin")) mission += "  ·  Studied today: " + minText(b.optInt("todayMin", 0));
                      v.setTextViewText(R.id.w1_mission, mission);
                  }
                  v.setOnClickPendingIntent(R.id.w1_root, open(c, 101));
                  return v;
              }

              private static void bindPin(RemoteViews v, JSONObject p, int sId, int dId, int daysId, int chronoId) {
                  if (p == null) {
                      v.setTextViewText(sId, "Not scheduled");
                      v.setTextViewText(dId, "Pick a paper in app Settings");
                      v.setTextViewText(daysId, "--");
                      v.setViewVisibility(chronoId, View.GONE);
                      return;
                  }
                  v.setTextViewText(sId, p.optString("subject", ""));
                  v.setTextViewText(dId, p.optString("date", "") + " · " + p.optString("time", ""));
                  bindCountdown(v, daysId, chronoId, p.optLong("at", 0));
              }

              static RemoteViews buildDual(Context c, int id) {
                  JSONObject b = bundle(c);
                  RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.widget_dual);
                  JSONArray pin = b.optJSONArray("pinned");
                  JSONObject p1 = pin == null ? null : pin.optJSONObject(0);
                  JSONObject p2 = pin == null ? null : pin.optJSONObject(1);
                  JSONArray cfg = config(c, id);
                  if (cfg.length() > 0) {
                      JSONObject x = findPaper(b, cfg.optString(0));
                      if (x != null) p1 = x;
                  }
                  if (cfg.length() > 1) {
                      JSONObject x = findPaper(b, cfg.optString(1));
                      if (x != null) p2 = x;
                  }
                  bindPin(v, p1, R.id.w2_s1, R.id.w2_d1, R.id.w2_days1, R.id.w2_chrono1);
                  bindPin(v, p2, R.id.w2_s2, R.id.w2_d2, R.id.w2_days2, R.id.w2_chrono2);
                  v.setOnClickPendingIntent(R.id.w2_root, open(c, 102));
                  return v;
              }

              static RemoteViews buildSchedule(Context c, int widgetId) {
                  JSONObject b = bundle(c);
                  RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.widget_schedule);
                  Intent svc = new Intent(c, ScheduleWidgetService.class);
                  svc.putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, widgetId);
                  svc.setData(Uri.parse(svc.toUri(Intent.URI_INTENT_SCHEME)));
                  v.setRemoteAdapter(R.id.w3_list, svc);
                  v.setEmptyView(R.id.w3_list, R.id.w3_empty);
                  v.setTextViewText(R.id.w3_count, b.optString("upcomingCount", ""));
                  v.setPendingIntentTemplate(R.id.w3_list, open(c, 103));
                  v.setOnClickPendingIntent(R.id.w3_head, open(c, 105));
                  return v;
              }

              static void updateAll(Context c) {
                  try {
                      AppWidgetManager m = AppWidgetManager.getInstance(c);
                      int[] a = m.getAppWidgetIds(new ComponentName(c, MainCountdownWidget.class));
                      for (int id : a) m.updateAppWidget(id, buildMain(c, id));
                      int[] d = m.getAppWidgetIds(new ComponentName(c, DualCoreWidget.class));
                      for (int id : d) m.updateAppWidget(id, buildDual(c, id));
                      int[] s = m.getAppWidgetIds(new ComponentName(c, ScheduleWidget.class));
                      for (int id : s) m.updateAppWidget(id, buildSchedule(c, id));
                      if (s.length > 0) m.notifyAppWidgetViewDataChanged(s, R.id.w3_list);
                  } catch (Exception ignored) {
                  }
                  armTick(c);
              }

              /** Din badalte hi (jab chronometer 0 par aata hai) widgets dobara bharne ka alarm; warna har 30 minute. */
              static void armTick(Context c) {
                  try {
                      JSONObject b = bundle(c);
                      long now = System.currentTimeMillis();
                      long next = now + 30L * 60000L;
                      java.util.ArrayList<Long> ats = new java.util.ArrayList<Long>();
                      ats.add(b.optLong("nextAt", 0));
                      JSONArray pin = b.optJSONArray("pinned");
                      if (pin != null) {
                          for (int i = 0; i < pin.length(); i++) {
                              JSONObject p = pin.optJSONObject(i);
                              if (p != null) ats.add(p.optLong("at", 0));
                          }
                      }
                      for (long at : ats) {
                          if (at > now) {
                              long rem = (at - now) % DAY;
                              long boundary = now + (rem == 0 ? DAY : rem);
                              next = Math.min(next, boundary + 1500L);
                          }
                      }
                      AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                      Intent i = new Intent(c, MainCountdownWidget.class);
                      i.setAction(ACTION_TICK);
                      PendingIntent pi = PendingIntent.getBroadcast(c, 7, i, FLAGS);
                      try {
                          if (Build.VERSION.SDK_INT >= 31 && !am.canScheduleExactAlarms()) {
                              am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, next, pi);
                          } else {
                              am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, next, pi);
                          }
                      } catch (SecurityException e) {
                          am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, next, pi);
                      }
                  } catch (Exception ignored) {
                  }
              }
          }
          EOF_3
          mkdir -p "$(dirname android/app/src/main/java/com/cbse/examtracker/MainActivity.java)"
          cat > android/app/src/main/java/com/cbse/examtracker/MainActivity.java <<'EOF_4'
