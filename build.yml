          cat > android/app/src/main/java/com/cbse/examtracker/ScheduleWidgetService.java <<'EOF_7'
          package com.cbse.examtracker;

          import android.content.Context;
          import android.content.Intent;
          import android.widget.RemoteViews;
          import android.widget.RemoteViewsService;
          import org.json.JSONArray;
          import org.json.JSONObject;

          /** Full Date Sheet widget ki scrollable list: sabhi papers, jitne bhi aapne set kiye hain. */
          public class ScheduleWidgetService extends RemoteViewsService {
              @Override
              public RemoteViewsFactory onGetViewFactory(Intent intent) {
                  return new Factory(getApplicationContext());
              }

              static class Factory implements RemoteViewsService.RemoteViewsFactory {
                  private final Context c;
                  private JSONArray rows = new JSONArray();
                  private long nextAt = 0;

                  Factory(Context ctx) {
                      c = ctx;
                  }

                  @Override
                  public void onCreate() {
                  }

                  @Override
                  public void onDataSetChanged() {
                      JSONObject b = ExamWidgetUtil.bundle(c);
                      JSONArray r = b.optJSONArray("datesheet");
                      rows = r == null ? new JSONArray() : r;
                      nextAt = b.optLong("nextAt", 0);
                  }

                  @Override
                  public void onDestroy() {
                  }

                  @Override
                  public int getCount() {
                      return rows.length();
                  }

                  @Override
                  public RemoteViews getViewAt(int position) {
                      RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.widget_row);
                      JSONObject o = rows.optJSONObject(position);
                      if (o == null) return v;
                      long at = o.optLong("at", 0);
                      long diff = at - System.currentTimeMillis();
                      String status;
                      int color;
                      if (diff <= 0) {
                          status = "Done";
                          color = 0xFF6B7280;
                      } else if (diff < ExamWidgetUtil.DAY) {
                          status = (diff / 3600000L) + "h left";
                          color = 0xFFEF4444;
                      } else {
                          long d = (long) Math.ceil(diff / (double) ExamWidgetUtil.DAY);
                          status = d + (d == 1 ? " day" : " days");
                          color = at == nextAt ? 0xFFF59E0B : 0xFF4ADE80;
                      }
                      boolean isNext = at == nextAt && diff > 0;
                      v.setTextViewText(R.id.row_date, o.optString("date", "") + "\n" + o.optString("time", ""));
                      v.setTextColor(R.id.row_date, isNext ? 0xFFF59E0B : 0xFFA0AAB5);
                      v.setTextViewText(R.id.row_subject, o.optString("subject", ""));
                      v.setTextColor(R.id.row_subject, diff <= 0 ? 0xFF6B7280 : 0xFFFFFFFF);
                      v.setTextViewText(R.id.row_status, status);
                      v.setTextColor(R.id.row_status, color);
                      v.setOnClickFillInIntent(R.id.row_root, new Intent());
                      return v;
                  }

                  @Override
                  public RemoteViews getLoadingView() {
                      return null;
                  }

                  @Override
                  public int getViewTypeCount() {
                      return 1;
                  }

                  @Override
                  public long getItemId(int position) {
                      return position;
                  }

                  @Override
                  public boolean hasStableIds() {
                      return true;
                  }
              }
          }
          EOF_7
