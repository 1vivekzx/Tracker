      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK ka naam
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/ExamTracker.apk
          ls -l out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Exam-Tracker-APK
          path: out/ExamTracker.apk

      - name: Download link (GitHub Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Exam Tracker APK (latest)
          body: "Latest Exam Tracker APK. Neeche Assets se ExamTracker.apk download karein."
          files: out/ExamTracker.apk
          target_commitish: ${{ github.sha }}
